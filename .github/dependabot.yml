# Actualizaciones de dependencias (mejoras 80 y 143 del plan maestro). Los parches de seguridad se proponen
# en cuanto se publican; el resto se agrupa una vez por semana para no generar ruido.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
