<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sin conexión | Descubre RD</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: light dark; --bg: #f7fafb; --fg: #10232b; --muted: #55707b; --primary: #0b7290; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d171c; --fg: #eef5f7; --muted: #9db4bd; --primary: #2bb7dd; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: .75rem 1.25rem; font: inherit; font-weight: 600; cursor: pointer; }
    .sos { text-align: left; border: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); border-radius: 12px; padding: 1rem; margin: 0 0 1.5rem; }
    .sos h2 { font-size: 1rem; margin: 0 0 .5rem; }
    .sos ul { list-style: none; margin: 0; padding: 0; line-height: 2; }
    .sos a { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva la conexión podrás seguir descubriendo República Dominicana.</p>
    <section class="sos" aria-labelledby="sos">
      <h2 id="sos">🚨 Teléfonos de emergencia en RD</h2>
      <ul>
        <li>Emergencias nacionales: <a href="tel:911">911</a></li>
        <li>Policía Turística (POLITUR): <a href="tel:+18092222010">+1 (809) 222-2010</a></li>
        <li>Asistencia vial (MOPC): <a href="tel:+18296881000">+1 (829) 688-1000</a></li>
      </ul>
    </section>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
