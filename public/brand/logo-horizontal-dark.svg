<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hdCaribbeanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A3C4" />
    </linearGradient>
    <linearGradient id="hdCoralSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#FF5238" />
    </linearGradient>
    <linearGradient id="hdGoldenSand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="hdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTIPO (Centered at X: 48, Y: 45, radius scale ~36) -->
  <g transform="translate(6, 6) scale(0.65)">
    <!-- Outer Compass Ring -->
    <circle cx="60" cy="60" r="48" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 4" />

    <!-- Diagonal Compass Points -->
    <path d="M60 60 L40 40 L60 48 L60 60 Z" fill="#00E5FF" fill-opacity="0.6" />
    <path d="M60 60 L80 40 L60 48 L60 60 Z" fill="#00E5FF" fill-opacity="0.35" />
    <path d="M60 60 L80 80 L60 72 L60 60 Z" fill="#00E5FF" fill-opacity="0.6" />
    <path d="M60 60 L40 80 L60 72 L60 60 Z" fill="#00E5FF" fill-opacity="0.35" />

    <!-- Cardinal Compass Points -->
    <polygon points="60,6 66,45 60,40" fill="#00E5FF" filter="url(#hdGlow)" />
    <polygon points="60,6 54,45 60,40" fill="#00A3C4" />
    <polygon points="60,114 66,75 60,80" fill="#00A3C4" />
    <polygon points="60,114 54,75 60,80" fill="#00E5FF" filter="url(#hdGlow)" />
    <polygon points="114,60 75,66 80,60" fill="#00E5FF" filter="url(#hdGlow)" />
    <polygon points="114,60 75,54 80,60" fill="#00A3C4" />
    <polygon points="6,60 45,66 40,60" fill="#00A3C4" />
    <polygon points="6,60 45,54 40,60" fill="#00E5FF" filter="url(#hdGlow)" />

    <!-- Central Circle Core -->
    <circle cx="60" cy="60" r="29" fill="#0B1317" stroke="#00E5FF" stroke-width="2.5" />

    <!-- Solar Corona Rays / Sun Arc -->
    <path d="M43 45 L40 38 L47 42 Z" fill="url(#hdCoralSun)" />
    <path d="M52 38 L51 31 L57 37 Z" fill="url(#hdCoralSun)" />
    <path d="M60 36 L60 29 L64 36 Z" fill="url(#hdGoldenSand)" />
    <path d="M68 38 L72 31 L71 39 Z" fill="url(#hdCoralSun)" />
    <path d="M77 45 L83 39 L78 47 Z" fill="url(#hdCoralSun)" />
    <path d="M37 57 A24 24 0 0 1 83 57" fill="none" stroke="url(#hdCoralSun)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Wave Crest & Foam -->
    <path d="M35 63 C 44 52, 53 54, 62 65 C 69 74, 76 72, 85 62 C 84 75, 73 85, 60 85 C 47 85, 36 75, 35 63 Z" fill="url(#hdCaribbeanGlow)" />
    <path d="M35 64 Q 48 53, 61 66 T 84 62" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
    <circle cx="60" cy="60" r="3" fill="#FFFFFF" filter="url(#hdGlow)" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Dark Mode: Crisp White + Caribbean Accent) -->
  <text x="100" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">
    Descubre <tspan fill="#00E5FF">RD</tspan>
  </text>
  
  <!-- SUBTITLE / GEOGRAPHIC POSITIONING -->
  <text x="102" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#7DD3FC" letter-spacing="2.5">
    REPÚBLICA DOMINICANA
  </text>
</svg>
