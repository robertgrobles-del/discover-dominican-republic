# Servicios de desarrollo: `docker compose up -d`
# Los puertos del host evitan chocar con un PostgreSQL local en 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: descubre_rd
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d descubre_rd"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  # Buzón de pruebas: los correos salen a http://localhost:8025 y nunca a destinatarios reales.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
